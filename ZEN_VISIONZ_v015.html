<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090d">
<title>ZEN VISIONZ — Ver.015</title>
<style>
:root{--bg:#07090d;--fg:#f7fbff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#grain{pointer-events:none;opacity:.045;mix-blend-mode:screen}
#veil{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 62% 58% at 50% 48%, rgba(255,255,255,.05) 0%, rgba(255,255,255,0) 42%, rgba(0,0,0,.10) 76%, rgba(0,0,0,.48) 100%),
  linear-gradient(to bottom, rgba(255,255,255,.035), rgba(255,255,255,0) 14%, rgba(255,255,255,0) 82%, rgba(255,255,255,.02));}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;z-index:4;transition:opacity 1.5s ease}
#intro.hidden{opacity:0}
.intro-inner{padding:20px 24px;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));backdrop-filter:blur(14px);box-shadow:0 0 80px rgba(255,255,255,.08), inset 0 0 26px rgba(255,255,255,.08)}
.kicker{font-size:10px;letter-spacing:.50em;color:rgba(247,251,255,.82)}
.title{margin:12px 0 10px;font-size:clamp(28px,10vw,60px);font-weight:900;letter-spacing:.18em}
.sub{font-size:10px;letter-spacing:.28em;line-height:2;color:rgba(247,251,255,.78)}
#releaseWrap{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:5;transition:opacity .8s ease}
#releaseWrap.dim{opacity:.18}
#release{appearance:none;border:none;background:transparent;color:rgba(255,255,255,.98);font-size:30px;line-height:1;cursor:pointer;padding:12px 16px;border-radius:50%;text-shadow:0 0 12px rgba(255,255,255,.95),0 0 32px rgba(255,255,255,.75),0 0 70px rgba(235,245,255,.52);box-shadow:inset 0 0 14px rgba(255,255,255,.05);transition:transform .16s ease, filter .3s ease, opacity .3s ease}
#release:active{transform:scale(.94)}#release:hover{filter:brightness(1.12)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,18,.82);backdrop-filter:blur(20px);padding:22px;z-index:10}
.modal.open{display:flex}
.panel{width:min(100%,460px);text-align:center}.panel .eyebrow{font-size:10px;letter-spacing:.36em;color:rgba(247,251,255,.82)}.panel h1{margin:12px 0 8px;font-size:clamp(26px,9vw,42px);letter-spacing:.12em;font-weight:850}.panel .subtitle{font-size:11px;line-height:1.8;letter-spacing:.18em;color:rgba(235,241,248,.76);margin:0 0 18px}.artframe{display:block;width:100%;aspect-ratio:1/1;background:#0b0f16;border:1px solid rgba(255,255,255,.24);box-shadow:0 0 70px rgba(255,255,255,.10)}
.statrow{display:flex;gap:10px;margin-top:14px}.stat{flex:1;padding:12px 8px;border-radius:18px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03)}.stat small{display:block;font-size:9px;letter-spacing:.14em;color:rgba(225,233,244,.58)}.stat div{margin-top:6px;font-size:16px;font-weight:800}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1;min-height:50px;padding:12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.14em;cursor:pointer}.primary{background:#f4f8ff;color:#11161f;border:1px solid rgba(255,255,255,.62)}.secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.18)}.footer{font-size:10px;letter-spacing:.14em;color:rgba(225,233,246,.45);margin-top:16px}
@media(max-width:420px){.sub{font-size:9px}#release{font-size:28px;padding:11px 15px}}
</style>
</head>
<body>
<canvas id="world" aria-label="luminous architecture of fine interwoven light"></canvas>
<canvas id="grain" aria-hidden="true"></canvas>
<div id="veil"></div>
<div id="intro"><div class="intro-inner"><div class="kicker">LIVING LIGHT</div><div class="title">ZEN VISIONZ</div><div class="sub">TOUCH TO BEND THE LIGHT<br>TAP ✦ WHEN IT FEELS COMPLETE</div></div></div>
<div id="releaseWrap"><button id="release" type="button" aria-label="release">✦</button></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="arttitle"><div class="panel"><div class="eyebrow">YOUR MOMENT, YOUR LIGHT.</div><h1 id="arttitle">RELEASED.</h1><p class="subtitle">THE END IS YOURS.</p><canvas id="art" class="artframe" width="1080" height="1080"></canvas><div class="statrow"><div class="stat"><small>FLOW TIME</small><div id="statTime">00:00</div></div><div class="stat"><small>DEPTH</small><div id="statDepth">01</div></div><div class="stat"><small>ARTWORK</small><div id="statNumber">#001</div></div></div><div class="actions"><button class="primary" id="save" type="button">SAVE ART</button><button class="secondary" id="continue" type="button">KEEP FLOWING</button></div><div class="footer">LET GO. KEEP THE VISION.</div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d',{alpha:false});
const noiseCanvas=document.getElementById('grain'),nctx=noiseCanvas.getContext('2d');
const intro=document.getElementById('intro'),releaseWrap=document.getElementById('releaseWrap');
const modal=document.getElementById('modal'),art=document.getElementById('art'),ac=art.getContext('2d');
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,v)=>a+(b-a)*v;
let W=0,H=0,dpr=1,phase=0,elapsed=0,last=0,freeze=false,count=0;
let pressing=false,px=0,py=0,tx=0,ty=0,power=0,aimPower=0,spin=0,tSpin=0;
let startX=0,startY=0,activePointer=null,idle=0;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function timer(s){s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,1.8);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);noiseCanvas.width=W;noiseCanvas.height=H;let img=nctx.createImageData(W,H);for(let k=0;k<img.data.length;k+=4){let v=225+Math.random()*30;img.data[k]=img.data[k+1]=img.data[k+2]=v;img.data[k+3]=7}nctx.putImageData(img,0,0)}
addEventListener('resize',resize);resize();
function dismiss(){intro.classList.add('hidden')}
setTimeout(dismiss,1950);
function interact(e){let nx=(e.clientX/W-.5)*2,ny=(e.clientY/H-.5)*2;
 tx=clamp(nx,-1,1);ty=clamp(ny,-1,1);
 aimPower=1;idle=0;releaseWrap.classList.remove('dim');dismiss();
}
canvas.addEventListener('pointerdown',e=>{if(activePointer!==null)return;activePointer=e.pointerId;pressing=true;startX=e.clientX;startY=e.clientY;interact(e);try{canvas.setPointerCapture(e.pointerId)}catch{}});
canvas.addEventListener('pointermove',e=>{if(!pressing||e.pointerId!==activePointer)return;
 tSpin=clamp(tSpin+(e.clientX-startX)/W*.03,-.12,.12);startX=e.clientX;startY=e.clientY;interact(e);
});
function stop(e){if(e.pointerId!==activePointer)return;pressing=false;activePointer=null;aimPower=0}
canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);addEventListener('blur',()=>{pressing=false;activePointer=null;aimPower=0});

function luminous(g,points,rgb,alpha,width,blur){
 if(points.length<2)return;
 g.save();g.beginPath();g.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)g.lineTo(points[i][0],points[i][1]);
 g.strokeStyle=`rgba(${rgb},${alpha})`;g.lineWidth=width;g.lineJoin='round';g.lineCap='round';
 g.shadowColor=`rgba(${rgb},${Math.min(1,alpha*1.8)})`;g.shadowBlur=blur;g.stroke();g.restore();
}
function bg(g,w,h,cx,cy,size,t){
 let grad=g.createRadialGradient(cx,cy,0,cx,cy,size*.98);
 grad.addColorStop(0,'#20232c');grad.addColorStop(.28,'#151923');grad.addColorStop(.70,'#090d16');grad.addColorStop(1,'#03050a');g.fillStyle=grad;g.fillRect(0,0,w,h);
 let halo=g.createRadialGradient(cx,cy-size*.09,0,cx,cy,size*.73);
 halo.addColorStop(0,'rgba(248,246,230,.19)');halo.addColorStop(.24,'rgba(235,242,255,.085)');halo.addColorStop(.60,'rgba(201,218,250,.026)');halo.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=halo;g.fillRect(0,0,w,h);
}
// A softly deforming coordinate system, shared by every filament: the geometry bends as a whole.
function renderer(g,w,h,t){
 const sz=Math.min(w*.96,h*.94),cx=w*.5+px*sz*.045,cy=h*.5+py*sz*.045;
 bg(g,w,h,cx,cy,Math.max(w,h),t);
 // No stationary trellis: each filament is a living time-varying curve.
 // Symmetry is maintained, but its geometry continuously folds and unfolds.
 const curveCount=reduced?17:29;
 const samples=reduced?62:96;
 const bend=power*.19;
 function deform(x,y,seed,depth){
   const waveA=Math.sin(t*.31 + y*3.2 + seed*.62);
   const waveB=Math.sin(t*.19 - y*5.2 + seed*.21);
   const waveC=Math.sin(t*.13 + x*4.5-y*1.3+seed*.71);
   const flutter=(waveA*.10+waveB*.058+waveC*.034)*(.42+depth*.58);
   const pinch=.88+.14*Math.sin(t*.27 + y*2.0);
   const x1=(x*pinch+flutter*(.45+.55*Math.abs(y))+px*bend*(1-y*y*.24));
   const y1=y + Math.sin(t*.24+x*3.1+seed*.31)*.047 + py*bend*.63;
   return [cx+x1*sz*.50,cy+y1*sz*.58];
 }
 // Three luminous depths flow in different directions. Continuous topology,
 // smooth amplitudes, and no changes of shape at fixed transition times.
 for(let depth=0;depth<3;depth++){
  const layerAlpha=[.38,.70,1][depth],layerScale=[1.12,.99,.87][depth];
  for(let i=0;i<curveCount;i++){
   const u=i/(curveCount-1),seed=i*.618+depth*2.17;
   const openness=.30+.55*(.5+.5*Math.sin(t*.23+seed*.31));
   const waist=.07+.28*(.5+.5*Math.sin(t*.17+seed*.47));
   const flow=t*(.13+depth*.015);
   const pts=[];
   for(let j=0;j<=samples;j++){
     const q=j/samples,y=1.25-2.5*q;
     const arch=Math.pow(Math.max(0,1-y*y/1.8),.60);
     const lattice=(u-.5)*1.65;
     const spread=(.12+Math.abs(lattice)*.62 + arch*openness*(.4+.45*Math.cos(seed*.5+flow)))*layerScale;
     const strand=spread*(1+.11*Math.sin(q*9+flow+seed));
     const weave=Math.sin(q*6.4+flow*1.6+seed)*waist;
     const x=strand+weave;
     pts.push(deform(x,y,seed,depth/2));
   }
   let alpha=layerAlpha*(.042+.045*Math.sin(Math.PI*u))*(.76+.24*Math.sin(t*.33+seed));
   luminous(g,pts,depth===0?'205,216,239':depth===1?'236,243,255':'253,251,244',alpha,.58+depth*.15,11+depth*4);
   // A mirrored partner bends in the opposite direction, without fixed arcs.
   const mirror=[];
   for(let j=0;j<=samples;j++){
     const q=j/samples,y=1.25-2.5*q;
     const arch=Math.pow(Math.max(0,1-y*y/1.8),.60);
     const lattice=(u-.5)*1.65;
     const spread=(.12+Math.abs(lattice)*.62 + arch*openness*(.4+.45*Math.cos(seed*.5+flow)))*layerScale;
     const strand=spread*(1+.11*Math.sin(q*9+flow+seed));
     const weave=Math.sin(q*6.4+flow*1.6+seed)*waist;
     mirror.push(deform(-strand-weave,y,seed+3.9,depth/2));
   }
   luminous(g,mirror,depth===0?'205,216,239':depth===1?'236,243,255':'253,251,244',alpha,.58+depth*.15,11+depth*4);
  }
 }
 // Continuously braided strands form and unform an inner light corridor.
 const innerCount=reduced?10:18;
 for(let i=0;i<innerCount;i++){
   let k=(i/(innerCount-1)-.5)*2;
   const pts=[];
   for(let j=0;j<=samples;j++){
     let q=j/samples,y=1.25-2.5*q;
     let contraction=.012+.12*Math.pow(Math.abs(y),1.25);
     let folding=.07*Math.sin(t*.29+q*6.8+i*.48);
     let x=k*(contraction+folding)+.055*Math.sin(y*3.1-t*.24+i*.39);
     pts.push(deform(x,y,i*.31,1));
   }
   luminous(g,pts,i%4===0?'255,250,234':'245,249,255',.09+.032*Math.sin(t*.24+i),.68,16);
 }
 // Misty central brightness breathes but does not turn into a flat disc.
 const radius=sz*(.16+.04*Math.sin(t*.19)+power*.035);
 const glow=g.createRadialGradient(cx,cy,0,cx,cy,radius);
 glow.addColorStop(0,'rgba(255,255,246,.30)');
 glow.addColorStop(.14,'rgba(255,251,241,.16)');
 glow.addColorStop(.47,'rgba(226,239,255,.055)');
 glow.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=glow;g.fillRect(cx-radius,cy-radius,radius*2,radius*2);
} 
function capture(){freeze=true;count++;
  // Preserve exactly the visible composition, without changing its scale or camera.
  const S=1080,thumb=document.createElement('canvas');thumb.width=S;thumb.height=S;
  const g=thumb.getContext('2d');renderer(g,S,S,phase);
  ac.clearRect(0,0,S,S);ac.drawImage(thumb,0,0);
  let fade=ac.createLinearGradient(0,760,0,S);fade.addColorStop(0,'rgba(5,8,15,0)');fade.addColorStop(1,'rgba(5,8,15,.84)');ac.fillStyle=fade;ac.fillRect(0,760,S,320);
  ac.strokeStyle='rgba(255,255,255,.55)';ac.lineWidth=2;ac.strokeRect(28,28,1024,1024);
  ac.fillStyle='#fff';ac.font='bold 37px Arial,sans-serif';ac.textAlign='left';ac.fillText('ZEN VISIONZ',76,928);
  ac.fillStyle='#f1eadc';ac.font='20px Arial,sans-serif';ac.fillText('THE END IS YOURS.',78,967);
  ac.textAlign='right';ac.fillStyle='#fff';ac.fillText('✦ '+String(count).padStart(3,'0'),1002,936);ac.fillText(timer(elapsed),1002,973);
  $('statTime').textContent=timer(elapsed);$('statDepth').textContent=String(Math.floor(1+elapsed/24)).padStart(2,'0');$('statNumber').textContent='#'+String(count).padStart(3,'0');modal.classList.add('open');
}
$('release').addEventListener('click',()=>{dismiss();capture()});
$('continue').addEventListener('click',()=>{modal.classList.remove('open');freeze=false;last=performance.now()});
$('save').addEventListener('click',()=>{art.toBlob(blob=>{if(!blob)return;let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ZEN_VISIONZ_RELEASE_'+String(count).padStart(3,'0')+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)},'image/png')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))$('continue').click()});
document.addEventListener('visibilitychange',()=>{last=performance.now()});
function frame(now){if(!last)last=now;let dt=Math.min(.05,(now-last)/1000);last=now;
 if(!freeze){elapsed+=dt;phase+=dt*(reduced?.42:1);idle+=dt;if(idle>4)releaseWrap.classList.add('dim');
  let follow=1-Math.exp(-dt*2.7);px=mix(px,pressing?tx:0,follow);py=mix(py,pressing?ty:0,follow);
  power=mix(power,pressing?aimPower:0,1-Math.exp(-dt*1.7));spin=mix(spin,tSpin,1-Math.exp(-dt*2));tSpin*=Math.exp(-dt*.7);
  renderer(ctx,W,H,phase);
 }
 requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
