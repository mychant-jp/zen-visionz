<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070c">
<title>ZEN VISIONZ — Ver.007</title>
<style>
:root{
  --bg:#05070c;
  --fg:#eef5ff;
  --muted:rgba(238,245,255,.72);
  --glow:rgba(225,238,255,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#grain{pointer-events:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 62% 58% at 50% 48%,transparent 56%,rgba(0,0,0,.22) 78%,rgba(0,0,0,.56) 100%),
  linear-gradient(to bottom,rgba(0,0,0,.14),transparent 18%,transparent 80%,rgba(0,0,0,.24));}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;z-index:4;transition:opacity 1.8s ease}
#intro.hidden{opacity:0}
.intro-inner{padding:20px 24px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));backdrop-filter:blur(12px);box-shadow:0 0 60px rgba(170,200,255,.06), inset 0 0 18px rgba(255,255,255,.04)}
.kicker{font-size:10px;letter-spacing:.46em;color:rgba(222,236,255,.82)}
.title{margin:12px 0 9px;font-size:clamp(26px,9vw,58px);font-weight:900;letter-spacing:.18em}
.sub{font-size:10px;letter-spacing:.30em;line-height:2.0;color:rgba(229,238,255,.82)}
#releaseWrap{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);z-index:5;transition:opacity .8s ease}
#releaseWrap.dim{opacity:.22}
#release{appearance:none;border:none;background:transparent;color:rgba(244,248,255,.94);font-size:28px;line-height:1;letter-spacing:0;cursor:pointer;padding:14px 18px;border-radius:50%;text-shadow:0 0 12px rgba(255,255,255,.56),0 0 28px rgba(170,205,255,.42),0 0 56px rgba(170,190,255,.28);box-shadow:inset 0 0 14px rgba(255,255,255,.05);transition:transform .18s ease,opacity .35s ease,filter .35s ease}
#release:active{transform:scale(.94)}
#release:hover{filter:brightness(1.15)}
#ghostTitle{position:fixed;top:calc(env(safe-area-inset-top) + 18px);left:50%;transform:translateX(-50%);z-index:4;font-size:9px;letter-spacing:.48em;color:rgba(226,236,255,.32);opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#ghostTitle.show{opacity:.7}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,12,.84);backdrop-filter:blur(20px);padding:22px;z-index:10}
.modal.open{display:flex}
.panel{width:min(100%,460px);text-align:center}
.panel .eyebrow{font-size:10px;letter-spacing:.36em;color:rgba(225,238,255,.82)}
.panel h1{margin:12px 0 8px;font-size:clamp(26px,9vw,42px);letter-spacing:.12em;font-weight:850}
.panel .subtitle{font-size:11px;line-height:1.8;letter-spacing:.18em;color:rgba(218,227,240,.78);margin:0 0 18px}
.artframe{display:block;width:100%;aspect-ratio:1/1;background:#090d14;border:1px solid rgba(255,255,255,.20);box-shadow:0 0 60px rgba(190,215,255,.10)}
.statrow{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;padding:12px 8px;border-radius:18px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03)}
.stat small{display:block;font-size:9px;letter-spacing:.14em;color:rgba(221,231,244,.56)}
.stat div{margin-top:6px;font-size:16px;font-weight:800}
.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1;min-height:50px;padding:12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.14em;cursor:pointer}
.primary{background:#eef4ff;color:#11161f;border:1px solid rgba(255,255,255,.60)}
.secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.18)}
.footer{font-size:10px;letter-spacing:.14em;color:rgba(225,233,246,.45);margin-top:16px}
@media(max-width:420px){
  .sub{font-size:9px}
  #release{font-size:26px;padding:13px 16px}
}
</style>
</head>
<body>
<canvas id="world" aria-label="発光する没入型ビジュアル"></canvas>
<canvas id="grain" aria-hidden="true"></canvas>
<div id="vignette"></div>

<div id="intro">
  <div class="intro-inner">
    <div class="kicker">LUMINOUS FLOW</div>
    <div class="title">ZEN VISIONZ</div>
    <div class="sub">TOUCH TO BEND THE LIGHT<br>TAP ✦ WHEN IT FEELS COMPLETE</div>
  </div>
</div>
<div id="releaseWrap"><button id="release" type="button" aria-label="release">✦</button></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="arttitle">
  <div class="panel">
    <div class="eyebrow">YOUR MOMENT, YOUR LIGHT.</div>
    <h1 id="arttitle">RELEASED.</h1>
    <p class="subtitle">THE END IS YOURS.</p>
    <canvas id="art" class="artframe" width="1080" height="1080"></canvas>
    <div class="statrow">
      <div class="stat"><small>FLOW TIME</small><div id="statTime">00:00</div></div>
      <div class="stat"><small>LUMINANCE</small><div id="statDepth">01</div></div>
      <div class="stat"><small>ARTWORK</small><div id="statNumber">#001</div></div>
    </div>
    <div class="actions">
      <button class="primary" id="save" type="button">SAVE ART</button>
      <button class="secondary" id="continue" type="button">KEEP FLOWING</button>
    </div>
    <div class="footer">LET GO. KEEP THE GLOW.</div>
  </div>
</div>

<script>
(()=>{
'use strict';
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d',{alpha:false});
const grainCanvas = document.getElementById('grain');
const grainCtx = grainCanvas.getContext('2d');
const intro = document.getElementById('intro');

const releaseWrap = document.getElementById('releaseWrap');
const releaseBtn = document.getElementById('release');
const modal = document.getElementById('modal');
const art = document.getElementById('art');
const ac = art.getContext('2d');
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const mix = (a,b,t)=>a+(b-a)*t;
const ease = t=>t*t*(3-2*t);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI*2;

let w=0,h=0,dpr=1;
let t=0,last=0,elapsed=0;
let pointerX=.5,pointerY=.5,targetX=.5,targetY=.5;
let hold=false, freeze=false, started=false;
let energy=.16, breath=.5, drift=0, idle=0, artCount=0;
const seed = Math.random()*1000;

const palettes = [
  {a:[245,248,255], b:[185,214,255], c:[172,167,255], d:[104,140,220]},
  {a:[255,255,255], b:[199,231,255], c:[208,198,255], d:[86,123,205]},
  {a:[242,248,255], b:[214,239,255], c:[188,180,255], d:[112,148,226]},
  {a:[248,250,255], b:[210,220,255], c:[197,176,255], d:[96,112,196]}
];

function rgba(arr,a=1){return `rgba(${arr[0]},${arr[1]},${arr[2]},${a})`;}
function timeText(sec){
  let s=Math.floor(sec);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function resize(){
  dpr = Math.min(devicePixelRatio||1,2);
  w = innerWidth; h = innerHeight;
  canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  grainCanvas.width = w; grainCanvas.height = h;
  grainCanvas.style.width = w+'px'; grainCanvas.style.height = h+'px';
  drawGrain();
}
addEventListener('resize',resize);
resize();

function drawGrain(){
  const img = grainCtx.createImageData(w,h);
  for(let i=0;i<img.data.length;i+=4){
    const v = 228 + Math.random()*26;
    img.data[i]=img.data[i+1]=img.data[i+2]=v;
    img.data[i+3]=8;
  }
  grainCtx.putImageData(img,0,0);
}

function palette(now){
  const c = now/26;
  const i0 = Math.floor(c)%palettes.length;
  const i1 = (i0+1)%palettes.length;
  const f = ease(c-Math.floor(c));
  const out={};
  for(const key of ['a','b','c','d']) out[key]=[0,1,2].map(k=>Math.round(mix(palettes[i0][key][k], palettes[i1][key][k], f)));
  return out;
}

function startExperience(){
  if(started) return;
  started = true;
  setTimeout(()=>intro.classList.add('hidden'), 250);

}
function registerActivity(){
  idle = 0;
  releaseWrap.classList.remove('dim');
}
function setPointer(x,y){
  targetX = clamp(x/w,0,1);
  targetY = clamp(y/h,0,1);
  registerActivity();
  startExperience();
}
canvas.addEventListener('pointerdown', e=>{hold=true; setPointer(e.clientX,e.clientY); try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove', e=>{if(hold) setPointer(e.clientX,e.clientY)});
canvas.addEventListener('pointerup', ()=> hold=false);
canvas.addEventListener('pointercancel', ()=> hold=false);
addEventListener('blur', ()=> hold=false);

function glowLine(g, points, width, color, alpha, blur){
  g.save();
  g.strokeStyle = color;
  g.lineWidth = width;
  g.globalAlpha = alpha;
  g.shadowBlur = blur;
  g.shadowColor = color;
  g.lineCap='round';
  g.lineJoin='round';
  g.beginPath();
  g.moveTo(points[0][0], points[0][1]);
  for(let i=1;i<points.length;i++) g.lineTo(points[i][0], points[i][1]);
  g.stroke();
  g.restore();
}

function drawHalo(g,cx,cy,min,pal,now){
  const outer = g.createRadialGradient(cx,cy,0,cx,cy,min*0.62);
  outer.addColorStop(0, rgba(pal.b,.04));
  outer.addColorStop(.22, rgba(pal.b,.12));
  outer.addColorStop(.44, rgba(pal.c,.10));
  outer.addColorStop(.72, rgba(pal.d,.06));
  outer.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = outer;
  g.beginPath(); g.arc(cx,cy,min*0.62,0,TAU); g.fill();

  const inner = g.createRadialGradient(cx,cy,0,cx,cy,min*0.23);
  inner.addColorStop(0, rgba(pal.a,.86));
  inner.addColorStop(.12, rgba(pal.b,.48));
  inner.addColorStop(.28, rgba(pal.c,.24));
  inner.addColorStop(.6, rgba(pal.d,.08));
  inner.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = inner;
  g.beginPath(); g.arc(cx,cy,min*0.23,0,TAU); g.fill();
}

function drawFilamentRings(g,cx,cy,min,pal,now){
  const rings = reduced ? 7 : 10;
  for(let r=0;r<rings;r++){
    const p = r/(rings-1);
    const radius = min*(0.08 + p*0.38*(1+Math.sin(now*.24+r*.2)*0.04));
    const petals = 8 + r*1.45 + Math.sin(now*.19+r)*1.2;
    const pts=[];
    const steps = reduced ? 84 : 126;
    for(let i=0;i<=steps;i++){
      const a = i/steps*TAU;
      const wave = Math.sin(a*petals + drift*1.3 + r*.4)*(.04 + (1-p)*.08 + energy*.03);
      const wave2 = Math.cos(a*(petals*.5) - now*.8 + r)*(.018 + energy*.014);
      const rr = radius*(1+wave+wave2);
      const x = cx + Math.cos(a + drift*.04)*rr;
      const y = cy + Math.sin(a + drift*.04)*rr*(0.92 + 0.05*Math.sin(now*.3));
      pts.push([x,y]);
    }
    glowLine(g, pts, Math.max(.7,1.6*(1-p)), r%2?rgba(pal.c,.95):rgba(pal.b,.95), .13 + (1-p)*.16, 10 + (1-p)*18);
  }
}

function drawSacredLattice(g,cx,cy,min,pal,now){
  g.save();
  g.translate(cx,cy);
  g.rotate(now*.035 + drift*.03);
  const layers = reduced ? 4 : 6;
  for(let layer=0; layer<layers; layer++){
    const p = layer/(layers-1 || 1);
    const r = min*(0.10 + layer*0.068);
    const nodes = 6 + layer*2;
    g.lineWidth = 1.0;
    g.strokeStyle = layer%2?rgba(pal.b,.14):rgba(pal.c,.12);
    g.shadowBlur = 12;
    g.shadowColor = layer%2?rgba(pal.b,.20):rgba(pal.c,.20);
    g.beginPath();
    for(let i=0;i<nodes;i++){
      const a = i*TAU/nodes;
      const x = Math.cos(a)*r;
      const y = Math.sin(a)*r;
      if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
    }
    g.closePath();
    g.stroke();
    for(let i=0;i<nodes;i++){
      const a = i*TAU/nodes + now*.08*(layer%2?1:-1);
      const x = Math.cos(a)*r;
      const y = Math.sin(a)*r;
      g.beginPath();
      g.fillStyle = rgba(pal.a,.12 + (1-p)*.16);
      g.shadowBlur = 14;
      g.shadowColor = rgba(pal.a,.25);
      g.arc(x,y,min*0.006*(1.5-p*.5),0,TAU);
      g.fill();
    }
  }
  g.restore();
}

function drawVeins(g,cx,cy,min,pal,now){
  g.save();
  g.globalCompositeOperation='screen';
  const spokes = reduced ? 10 : 14;
  for(let i=0;i<spokes;i++){
    const a = i*TAU/spokes + now*.03;
    const points=[];
    const segments=5;
    for(let s=0;s<=segments;s++){
      const p = s/segments;
      const rad = min*(0.12 + p*0.45 + Math.sin(now*.22 + i + s)*0.015);
      const bend = Math.sin(now*.7 + i*.5 + s)*0.24*(1-p);
      points.push([
        cx + Math.cos(a+bend)*rad,
        cy + Math.sin(a+bend)*rad
      ]);
    }
    glowLine(g, points, 1.2 + energy*.8, i%3===0?rgba(pal.a,.92):rgba(pal.b,.92), .10 + energy*.06, 14);
  }
  g.restore();
}

function drawCoreEye(g,cx,cy,min,pal,now){
  g.save();
  g.translate(cx,cy);
  g.rotate(Math.sin(now*.14)*0.09);
  const ew = min*(0.13 + energy*.04);
  const eh = min*(0.05 + Math.sin(now*.9)*0.004);
  g.shadowBlur = 26;
  g.shadowColor = rgba(pal.a,.35);
  g.strokeStyle = rgba(pal.a,.22);
  g.lineWidth = 1.4;
  g.beginPath();
  g.ellipse(0,0,ew,eh,0,0,TAU);
  g.stroke();
  g.beginPath();
  g.fillStyle = rgba(pal.a,.85);
  g.arc(0,0,min*(0.018 + energy*.008),0,TAU);
  g.fill();
  g.restore();
}

function render(g,W,H,now){
  const pal = palette(now);
  const cx = W*(0.5 + (pointerX-.5)*0.10);
  const cy = H*(0.5 + (pointerY-.5)*0.10);
  const min = Math.min(W,H);
  const max = Math.max(W,H);

  const bg = g.createRadialGradient(cx,cy,0,cx,cy,max*0.85);
  bg.addColorStop(0, 'rgba(13,18,28,1)');
  bg.addColorStop(.34, 'rgba(9,12,20,1)');
  bg.addColorStop(.68, 'rgba(6,8,14,1)');
  bg.addColorStop(1, 'rgba(4,5,9,1)');
  g.fillStyle = bg;
  g.fillRect(0,0,W,H);

  drawHalo(g,cx,cy,min,pal,now);
  drawVeins(g,cx,cy,min,pal,now);
  drawFilamentRings(g,cx,cy,min,pal,now);
  drawSacredLattice(g,cx,cy,min,pal,now);
  drawCoreEye(g,cx,cy,min,pal,now);

  g.globalCompositeOperation='screen';
  for(let i=0;i<4;i++){
    const yy = cy + (i-1.5)*min*0.11;
    const rr = min*(0.12 + i*0.07 + energy*.02);
    g.strokeStyle = i%2?rgba(pal.b,.07):rgba(pal.c,.06);
    g.lineWidth = 1;
    g.shadowBlur = 14;
    g.shadowColor = i%2?rgba(pal.b,.10):rgba(pal.c,.10);
    g.beginPath();
    g.arc(cx,yy,rr,Math.PI*.11,Math.PI*.89);
    g.stroke();
    g.beginPath();
    g.arc(cx,yy,rr,-Math.PI*.89,-Math.PI*.11);
    g.stroke();
  }
  g.globalCompositeOperation='source-over';

  const veil = g.createLinearGradient(0,0,W,H);
  veil.addColorStop(0,'rgba(240,245,255,.018)');
  veil.addColorStop(.5,'rgba(255,255,255,0)');
  veil.addColorStop(1,'rgba(210,220,255,.014)');
  g.fillStyle = veil;
  g.fillRect(0,0,W,H);
}

function capture(){
  freeze = true;
  artCount++;
  const S=1080;
  const tx=document.createElement('canvas');
  tx.width=S; tx.height=S;
  const gx=tx.getContext('2d');
  render(gx,S,S,t + seed*0.0017);
  ac.clearRect(0,0,S,S);
  ac.fillStyle='#060912';
  ac.fillRect(0,0,S,S);
  ac.drawImage(tx,0,0);
  const fade=ac.createLinearGradient(0,785,0,S);
  fade.addColorStop(0,'rgba(6,9,18,0)');
  fade.addColorStop(1,'rgba(6,9,18,.88)');
  ac.fillStyle=fade;
  ac.fillRect(0,785,S,295);
  ac.strokeStyle='rgba(255,255,255,.68)';
  ac.lineWidth=2;
  ac.strokeRect(28,28,S-56,S-56);
  ac.fillStyle='#f2f6ff';
  ac.textAlign='left';
  ac.font='bold 38px Arial, sans-serif';
  ac.fillText('ZEN VISIONZ',76,932);
  ac.font='20px Arial, sans-serif';
  ac.fillStyle='rgba(230,238,255,.86)';
  ac.fillText('THE END IS YOURS.',78,970);
  ac.textAlign='right';
  ac.fillStyle='#ffffff';
  ac.font='20px Arial, sans-serif';
  ac.fillText('✦ '+String(artCount).padStart(3,'0'),1000,938);
  ac.fillStyle='rgba(208,218,233,.88)';
  ac.fillText(timeText(elapsed),1000,972);
  $('statTime').textContent = timeText(elapsed);
  $('statDepth').textContent = String(Math.floor(1+t/22)).padStart(2,'0');
  $('statNumber').textContent = '#'+String(artCount).padStart(3,'0');
  modal.classList.add('open');
}
releaseBtn.addEventListener('click', ()=>{startExperience(); capture();});
$('continue').addEventListener('click', ()=>{modal.classList.remove('open'); freeze=false; last=performance.now(); registerActivity();});
$('save').addEventListener('click', ()=>{art.toBlob(blob=>{if(!blob)return; const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='ZEN_VISIONZ_RELEASE_'+String(artCount).padStart(3,'0')+'.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);},'image/png')});
document.addEventListener('keydown', e=>{if(e.key==='Escape' && modal.classList.contains('open')) $('continue').click();});
document.addEventListener('visibilitychange', ()=>{last=performance.now()});

function frame(now){
  if(!last) last=now;
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(!freeze){
    t += dt*(reduced?.34:1);
    elapsed += dt;
    idle += dt;
    if(idle>4.2) releaseWrap.classList.add('dim');
    pointerX = mix(pointerX,targetX,Math.min(1,dt*2.4));
    pointerY = mix(pointerY,targetY,Math.min(1,dt*2.4));
    energy = mix(energy, hold?.92:.18, dt*2.5);
    breath = .5 + Math.sin(t*.52)*.5;
    drift += dt*(.16 + energy*.32);
    if(!hold){
      targetX = mix(targetX,.5 + Math.sin(t*.07)*.016,dt*.28);
      targetY = mix(targetY,.5 + Math.cos(t*.05)*.016,dt*.28);
    }
    render(ctx,w,h,t);
  }
  requestAnimationFrame(frame);
}
setTimeout(startExperience, 2200);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
