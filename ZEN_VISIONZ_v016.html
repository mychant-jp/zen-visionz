<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090d">
<title>ZEN VISIONZ — Ver.016</title>
<style>
:root{--bg:#07090d;--fg:#f7fbff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#grain{pointer-events:none;opacity:.04;mix-blend-mode:screen}
#veil{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 60% 56% at 50% 46%, rgba(255,255,255,.05) 0%, rgba(255,255,255,0) 45%, rgba(0,0,0,.12) 78%, rgba(0,0,0,.48) 100%),
  linear-gradient(to bottom, rgba(255,255,255,.03), rgba(255,255,255,0) 16%, rgba(255,255,255,0) 84%, rgba(255,255,255,.02));}
#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;z-index:4;transition:opacity 1.4s ease}
#intro.hidden{opacity:0}
.intro-inner{padding:20px 24px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));backdrop-filter:blur(14px);box-shadow:0 0 80px rgba(255,255,255,.08), inset 0 0 26px rgba(255,255,255,.08)}
.kicker{font-size:10px;letter-spacing:.50em;color:rgba(247,251,255,.82)}
.title{margin:12px 0 10px;font-size:clamp(28px,10vw,60px);font-weight:900;letter-spacing:.18em}
.sub{font-size:10px;letter-spacing:.24em;line-height:2;color:rgba(247,251,255,.78)}
#releaseWrap{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:5;transition:opacity .8s ease}
#releaseWrap.dim{opacity:.18}
#release{appearance:none;border:none;background:transparent;color:rgba(255,255,255,.98);font-size:30px;line-height:1;cursor:pointer;padding:12px 16px;border-radius:50%;text-shadow:0 0 12px rgba(255,255,255,.95),0 0 32px rgba(255,255,255,.75),0 0 70px rgba(235,245,255,.52);box-shadow:inset 0 0 14px rgba(255,255,255,.05);transition:transform .16s ease, filter .3s ease, opacity .3s ease}
#release:active{transform:scale(.94)}#release:hover{filter:brightness(1.12)}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,12,18,.82);backdrop-filter:blur(20px);padding:22px;z-index:10}
.modal.open{display:flex}
.panel{width:min(100%,460px);text-align:center}.panel .eyebrow{font-size:10px;letter-spacing:.36em;color:rgba(247,251,255,.82)}.panel h1{margin:12px 0 8px;font-size:clamp(26px,9vw,42px);letter-spacing:.12em;font-weight:850}.panel .subtitle{font-size:11px;line-height:1.8;letter-spacing:.18em;color:rgba(235,241,248,.76);margin:0 0 18px}.artframe{display:block;width:100%;aspect-ratio:1/1;background:#0b0f16;border:1px solid rgba(255,255,255,.24);box-shadow:0 0 70px rgba(255,255,255,.10)}
.statrow{display:flex;gap:10px;margin-top:14px}.stat{flex:1;padding:12px 8px;border-radius:18px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03)}.stat small{display:block;font-size:9px;letter-spacing:.14em;color:rgba(225,233,244,.58)}.stat div{margin-top:6px;font-size:16px;font-weight:800}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1;min-height:50px;padding:12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.14em;cursor:pointer}.primary{background:#f4f8ff;color:#11161f;border:1px solid rgba(255,255,255,.62)}.secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.18)}.footer{font-size:10px;letter-spacing:.14em;color:rgba(225,233,246,.45);margin-top:16px}
@media(max-width:420px){.sub{font-size:9px}#release{font-size:28px;padding:11px 15px}}
</style>
</head>
<body>
<canvas id="world" aria-label="white luminous infinite vision portal"></canvas>
<canvas id="grain" aria-hidden="true"></canvas>
<div id="veil"></div>
<div id="intro"><div class="intro-inner"><div class="kicker">INTUITIVE VISION</div><div class="title">ZEN VISIONZ</div><div class="sub">SWIPE LEFT / RIGHT = FLOW<br>SWIPE UP / DOWN = DEPTH<br>HOLD = GLOW</div></div></div>
<div id="releaseWrap"><button id="release" type="button" aria-label="release">✦</button></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="arttitle"><div class="panel"><div class="eyebrow">YOUR MOMENT, YOUR LIGHT.</div><h1 id="arttitle">RELEASED.</h1><p class="subtitle">THE END IS YOURS.</p><canvas id="art" class="artframe" width="1080" height="1080"></canvas><div class="statrow"><div class="stat"><small>FLOW TIME</small><div id="statTime">00:00</div></div><div class="stat"><small>DEPTH</small><div id="statDepth">01</div></div><div class="stat"><small>ARTWORK</small><div id="statNumber">#001</div></div></div><div class="actions"><button class="primary" id="save" type="button">SAVE ART</button><button class="secondary" id="continue" type="button">KEEP FLOWING</button></div><div class="footer">LET GO. KEEP THE VISION.</div></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d',{alpha:false});
const grainCanvas=document.getElementById('grain'),grainCtx=grainCanvas.getContext('2d');
const intro=document.getElementById('intro');
const releaseWrap=document.getElementById('releaseWrap');
const releaseBtn=document.getElementById('release');
const modal=document.getElementById('modal');
const art=document.getElementById('art');
const ac=art.getContext('2d');
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let w=0,h=0,dpr=1,last=0,time=0,elapsed=0;
let hold=false,freeze=false,started=false;
let idle=0,artCount=0;
let pointerX=.5,pointerY=.5;
let flow=0,flowTarget=0;      // -1 .. 1  horizontal movement
let depth=.42,depthTarget=.42; // 0 .. 1 vertical opening
let glow=.0,glowTarget=.0;     // 0 .. 1 hold glow
let phase=0;
let lastNX=.5,lastNY=.5;

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  w=innerWidth; h=innerHeight;
  canvas.width=Math.floor(w*dpr); canvas.height=Math.floor(h*dpr);
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  grainCanvas.width=w; grainCanvas.height=h;
  grainCanvas.style.width=w+'px'; grainCanvas.style.height=h+'px';
  drawGrain();
}
addEventListener('resize',resize);
resize();

function drawGrain(){
  const img=grainCtx.createImageData(w,h);
  for(let i=0;i<img.data.length;i+=4){
    const v=240+Math.random()*10;
    img.data[i]=img.data[i+1]=img.data[i+2]=v;
    img.data[i+3]=5;
  }
  grainCtx.putImageData(img,0,0);
}

function hideIntro(){intro.classList.add('hidden');}
function startExperience(){if(started) return; started=true; hideIntro();}
setTimeout(hideIntro,2600);

function registerActivity(){idle=0;releaseWrap.classList.remove('dim');}
function setPointer(clientX,clientY){
  const nx=clamp(clientX/w,0,1), ny=clamp(clientY/h,0,1);
  const dx=nx-lastNX, dy=ny-lastNY;
  lastNX=nx; lastNY=ny;
  pointerX=nx; pointerY=ny;
  flowTarget = clamp(flowTarget + dx*5.0, -1, 1);
  depthTarget = clamp(depthTarget - dy*2.4, 0.06, 0.96);
  registerActivity();
  startExperience();
}
canvas.addEventListener('pointerdown',e=>{hold=true; glowTarget=1; lastNX=e.clientX/w; lastNY=e.clientY/h; setPointer(e.clientX,e.clientY); try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(hold) setPointer(e.clientX,e.clientY)});
canvas.addEventListener('pointerup',()=>{hold=false; glowTarget=0;});
canvas.addEventListener('pointercancel',()=>{hold=false; glowTarget=0;});
addEventListener('blur',()=>{hold=false; glowTarget=0;});

function timeText(sec){const s=Math.floor(sec);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function rgba(arr,a=1){return `rgba(${arr[0]},${arr[1]},${arr[2]},${a})`;}
const white=[255,255,255], soft=[240,246,255], pale=[226,236,248], cool=[210,223,242];

function drawBackground(g,W,H,cx,cy){
  const bg=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*0.9);
  bg.addColorStop(0,'rgba(19,23,31,1)');
  bg.addColorStop(.34,'rgba(12,15,21,1)');
  bg.addColorStop(.78,'rgba(7,9,14,1)');
  bg.addColorStop(1,'rgba(5,6,10,1)');
  g.fillStyle=bg; g.fillRect(0,0,W,H);
  const mist=g.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*(0.72+depth*0.14));
  mist.addColorStop(0,rgba(soft,.10+.05*glow));
  mist.addColorStop(.25,rgba(pale,.06));
  mist.addColorStop(.72,rgba(cool,.018));
  mist.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=mist; g.fillRect(0,0,W,H);
}

function strokeGlow(g,path,color,alpha,width,blur){
  g.save();
  g.strokeStyle=color;
  g.lineWidth=width;
  g.globalAlpha=alpha;
  g.shadowBlur=blur;
  g.shadowColor=color;
  g.lineCap='round'; g.lineJoin='round';
  g.stroke(path);
  g.restore();
}

function drawPortal(g,W,H,now){
  const min=Math.min(W,H);
  const cx=W*(0.5 + (pointerX-.5)*0.10 + flow*0.04);
  const cy=H*(0.5 + (pointerY-.5)*0.05);
  drawBackground(g,W,H,cx,cy);

  const visibleLayers = 11 + Math.round(depth*7);
  const innerGlow = .12 + depth*0.14 + glow*0.06;
  const sway = flow*min*0.10;
  const portalDepth = 0.48 + depth*0.56;
  const breathing = 1 + Math.sin(now*0.24)*0.012;

  // faint depth ellipses
  g.save();
  g.globalCompositeOperation='screen';
  for(let i=0;i<6;i++){
    const p=i/5;
    const r=min*(0.08 + p*(0.28+depth*0.15));
    g.beginPath();
    g.ellipse(cx,cy,r,r*(0.64+depth*0.14),flow*0.25*(1-p),0,TAU);
    g.strokeStyle=rgba(soft,.020+(1-p)*.03+glow*.015);
    g.lineWidth=1;
    g.shadowBlur=12;
    g.shadowColor=rgba(white,.10);
    g.stroke();
  }
  g.restore();

  for(let layer=0; layer<visibleLayers; layer++){
    const p = layer/(visibleLayers-1 || 1);
    const depthP = Math.pow(p,0.86);
    const ySpan = min*(0.15 + depthP*(0.30 + depth*0.12))*breathing;
    const archWidth = min*(0.06 + depthP*(0.12 + depth*0.09));
    const baseInset = min*(0.018 + (1-depthP)*0.026);
    const warp = Math.sin(now*0.55 + layer*.42)*min*(0.006 + depthP*0.012);
    const layerFlow = sway*(0.22 + depthP*0.85);
    const alpha = 0.04 + depthP*0.11 + glow*0.06;
    const width = 0.7 + depthP*1.3 + glow*0.5;
    const blur = 10 + depthP*16 + glow*16;

    for(let strand=0; strand<4; strand++){
      const strandP = strand/3;
      const offset = archWidth*(0.55 + strandP*0.45);
      const pinch = 1 - strandP*0.12;
      for(const side of [-1,1]){
        const startX = cx + side*(baseInset + strandP*min*0.010) + layerFlow*0.18;
        const startY = cy + ySpan*(0.92 + strandP*0.04);
        const endX = cx + side*(baseInset*0.8 + strandP*min*0.006) - layerFlow*0.10;
        const endY = cy - ySpan*(0.96 - strandP*0.05);
        const cp1X = cx + side*(offset + layerFlow*0.92 + warp*side);
        const cp1Y = cy + ySpan*(0.26 - strandP*0.06);
        const cp2X = cx + side*(offset*pinch + layerFlow*1.12 - warp*side*0.5);
        const cp2Y = cy - ySpan*(0.58 + strandP*0.06);
        const path = new Path2D();
        path.moveTo(startX,startY);
        path.bezierCurveTo(cp1X,cp1Y,cp2X,cp2Y,endX,endY);
        const tone = strand<2?white:(strand===2?soft:pale);
        strokeGlow(g,path,rgba(tone,.98),alpha*(1-strandP*0.12),width*(1-strandP*0.08),blur);
      }
    }
  }

  // center opening
  const coreRad = min*(0.050 + depth*0.09 + glow*0.015);
  const core = g.createRadialGradient(cx,cy,0,cx,cy,coreRad*2.9);
  core.addColorStop(0,rgba(white,.95));
  core.addColorStop(.10,rgba(soft,.55));
  core.addColorStop(.34,rgba(pale,.18));
  core.addColorStop(.70,rgba(cool,.05));
  core.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=core;
  g.beginPath();
  g.ellipse(cx,cy,coreRad*(1.10+depth*0.18),coreRad*(1.35+depth*0.45),flow*0.16,0,TAU);
  g.fill();

  // subtle cross filaments for living motion
  const filamentCount = 5;
  for(let i=0;i<filamentCount;i++){
    const p=i/(filamentCount-1||1);
    const yy = cy + (p-.5)*min*(0.26+depth*0.12);
    const filament = new Path2D();
    filament.moveTo(cx - min*(0.18+depth*0.07), yy);
    filament.bezierCurveTo(
      cx - min*(0.08) + sway*0.3, yy - min*(0.05+0.02*Math.sin(now*.7+i)),
      cx + min*(0.08) + sway*0.3, yy + min*(0.05+0.02*Math.cos(now*.6+i)),
      cx + min*(0.18+depth*0.07), yy
    );
    strokeGlow(g,filament,rgba(soft,.96),0.012 + glow*0.02 + (1-Math.abs(p-.5))*0.012,0.8,10+glow*8);
  }

  const veil=g.createLinearGradient(0,0,W,H);
  veil.addColorStop(0,'rgba(255,255,255,.022)');
  veil.addColorStop(.5,'rgba(255,255,255,0)');
  veil.addColorStop(1,'rgba(255,255,255,.014)');
  g.fillStyle=veil; g.fillRect(0,0,W,H);
}

function capture(){
  freeze=true;
  artCount++;
  const S=1080;
  const tx=document.createElement('canvas'); tx.width=S; tx.height=S;
  const gx=tx.getContext('2d');
  drawPortal(gx,S,S,time);
  ac.clearRect(0,0,S,S);
  ac.fillStyle='#0a0d14'; ac.fillRect(0,0,S,S);
  ac.drawImage(tx,0,0);
  const fade=ac.createLinearGradient(0,785,0,S);
  fade.addColorStop(0,'rgba(10,13,20,0)');
  fade.addColorStop(1,'rgba(10,13,20,.88)');
  ac.fillStyle=fade; ac.fillRect(0,785,S,295);
  ac.strokeStyle='rgba(255,255,255,.72)'; ac.lineWidth=2; ac.strokeRect(28,28,S-56,S-56);
  ac.fillStyle='#ffffff'; ac.textAlign='left'; ac.font='bold 38px Arial, sans-serif'; ac.fillText('ZEN VISIONZ',76,932);
  ac.font='20px Arial, sans-serif'; ac.fillStyle='rgba(240,245,255,.88)'; ac.fillText('THE END IS YOURS.',78,970);
  ac.textAlign='right'; ac.fillStyle='#ffffff'; ac.font='20px Arial, sans-serif'; ac.fillText('✦ '+String(artCount).padStart(3,'0'),1000,938);
  ac.fillStyle='rgba(216,225,238,.88)'; ac.fillText(timeText(elapsed),1000,972);
  $('statTime').textContent=timeText(elapsed);
  $('statDepth').textContent=String(Math.round(1 + depth*98)).padStart(2,'0');
  $('statNumber').textContent='#'+String(artCount).padStart(3,'0');
  modal.classList.add('open');
}
releaseBtn.addEventListener('click',()=>{startExperience();capture();});
$('continue').addEventListener('click',()=>{modal.classList.remove('open'); freeze=false; last=performance.now(); registerActivity();});
$('save').addEventListener('click',()=>{art.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ZEN_VISIONZ_RELEASE_'+String(artCount).padStart(3,'0')+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);},'image/png')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))$('continue').click();});
document.addEventListener('visibilitychange',()=>{last=performance.now()});

function frame(now){
  if(!last) last=now;
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(!freeze){
    time += dt*(reduced?.35:1);
    elapsed += dt;
    idle += dt;
    if(idle>4.2) releaseWrap.classList.add('dim');

    flow = mix(flow, flowTarget, Math.min(1, dt*4.0));
    depth = mix(depth, depthTarget, Math.min(1, dt*3.2));
    glow = mix(glow, glowTarget, Math.min(1, dt*4.2));

    if(!hold){
      flowTarget *= Math.pow(.20, dt);
      glowTarget = 0;
    }
    depthTarget = mix(depthTarget, .42 + Math.sin(time*.08)*0.015, dt*0.12);
    phase += dt*(0.18 + depth*0.16);

    drawPortal(ctx,w,h,time+phase);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
