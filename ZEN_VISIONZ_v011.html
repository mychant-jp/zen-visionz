<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05070b"><title>ZEN VISIONZ — Ver.011 | LIVING LIGHT</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;touch-action:none}button{font:inherit}#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 48%,transparent 40%,rgba(0,0,0,.40) 100%)}#intro{position:fixed;inset:0;display:grid;place-items:center;text-align:center;z-index:3;pointer-events:none;opacity:1;transition:opacity 2s ease}#intro.hide{opacity:0}.introbox{padding:24px;background:rgba(5,7,11,.30);border-radius:24px;backdrop-filter:blur(8px)}.introbox h1{margin:0 0 11px;font-size:clamp(25px,8vw,48px);letter-spacing:.13em;font-weight:850;white-space:nowrap;text-shadow:0 0 25px #ffffff60}.introbox small{font-size:10px;letter-spacing:.25em;color:#e0e7f5;line-height:2.2}#releaseWrap{position:fixed;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);transition:opacity .8s}#releaseWrap.faint{opacity:.3}#release{appearance:none;display:grid;place-items:center;width:56px;height:56px;border:0;border-radius:100%;background:#ffffff08;color:#fff;font-size:28px;text-shadow:0 0 12px #fff,0 0 42px #cedeff;box-shadow:0 0 28px #ffffff15;cursor:pointer}#release:active{transform:scale(.95)}#modal{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:#04050bea;backdrop-filter:blur(14px);padding:18px;overflow-y:auto;touch-action:pan-y}#modal.open{display:flex}.panel{max-width:430px;width:100%;text-align:center}.eyebrow{font-size:10px;letter-spacing:.3em;color:#dce6fb}.panel h2{font-size:32px;letter-spacing:.13em;margin:10px 0 6px}.tag{font-size:11px;letter-spacing:.19em;color:#c0cada;margin:0 0 15px}#art{display:block;width:100%;aspect-ratio:1;background:#0a0d15;border:1px solid #ffffff45;box-shadow:0 0 40px #ffffff18}.info{display:flex;justify-content:space-between;gap:12px;color:#c5ccdb;font-size:10px;letter-spacing:.17em;margin:14px 0}.actions{display:flex;gap:10px}.actions button{flex:1;border-radius:999px;padding:14px 9px;min-height:50px;font-size:11px;font-weight:750;letter-spacing:.12em;cursor:pointer}.save{color:#111821;background:#f5f8ff;border:1px solid white}.resume{color:#fff;background:#ffffff12;border:1px solid #ffffff4a}@media(prefers-reduced-motion:reduce){#intro{transition:none}}
</style></head><body>
<canvas id="world" aria-label="Touch-responsive living light visualization"></canvas><div id="shade"></div><div id="intro"><div class="introbox"><h1>ZEN VISIONZ</h1><small>TOUCH THE LIGHT<br>THE END IS YOURS.</small></div></div><div id="releaseWrap"><button type="button" id="release" aria-label="RELEASE">✦</button></div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="arttitle"><div class="panel"><div class="eyebrow">YOUR MOMENT, YOUR LIGHT</div><h2 id="arttitle">RELEASED.</h2><p class="tag">THE END IS YOURS.</p><canvas id="art" width="1080" height="1080" aria-label="Saved light artwork"></canvas><div class="info"><span id="runtime">00:00</span><span id="number">ARTWORK 001</span></div><div class="actions"><button class="save" id="save" type="button">SAVE ART</button><button class="resume" id="resume" type="button">KEEP FLOWING</button></div></div></div>
<script>
(()=>{'use strict';
const c=document.getElementById('world'),g=c.getContext('2d',{alpha:false});const intro=document.getElementById('intro'),modal=document.getElementById('modal'),art=document.getElementById('art'),ag=art.getContext('2d');const rel=document.getElementById('releaseWrap');const TAU=Math.PI*2;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;let W=0,H=0,scale=1,clock=0,last=0,elapsed=0,paused=false,artNum=0,contact=false,interaction=0,idle=0;let px=0,py=0,prevX=0,prevY=0,forceX=0,forceY=0,fieldStrength=0;let trails=[];let specks=[];const isMobile=window.innerWidth<720;const strandCount=isMobile?38:58,particleCount=isMobile?90:150;const rand=(a,b)=>a+Math.random()*(b-a);
function restartCanvas(){W=innerWidth;H=innerHeight;scale=Math.min(devicePixelRatio||1,isMobile?1.45:1.8);c.width=Math.round(W*scale);c.height=Math.round(H*scale);g.setTransform(scale,0,0,scale,0,0);g.fillStyle='#05070b';g.fillRect(0,0,W,H);for(const s of trails){s.x=clamp(s.x,0,W);s.y=clamp(s.y,0,H)} }addEventListener('resize',restartCanvas);restartCanvas();
function newStrand(i){let theta=i*2.39996;let rad=Math.sqrt((i+.5)/strandCount)*Math.min(W,H)*.28;return{x:W*.5+Math.cos(theta)*rad,y:H*.49+Math.sin(theta)*rad,vx:0,vy:0,phase:rand(0,TAU),speed:rand(.55,1.4),width:rand(.7,1.5),history:[],age:rand(0,5)}}
for(let i=0;i<strandCount;i++)trails.push(newStrand(i));for(let i=0;i<particleCount;i++)specks.push({x:rand(0,W),y:rand(0,H),vx:rand(-.15,.15),vy:rand(-.15,.15),z:rand(.3,1),phase:rand(0,TAU)});
function onMove(x,y){prevX=px||x;prevY=py||y;px=x;py=y;forceX=clamp((x-prevX)*.22,-13,13);forceY=clamp((y-prevY)*.22,-13,13);fieldStrength=1;interaction=1;idle=0;rel.classList.remove('faint');intro.classList.add('hide')}
c.addEventListener('pointerdown',e=>{contact=true;onMove(e.clientX,e.clientY);try{c.setPointerCapture(e.pointerId)}catch(_){}});c.addEventListener('pointermove',e=>{if(contact)onMove(e.clientX,e.clientY)});c.addEventListener('pointerup',()=>contact=false);c.addEventListener('pointercancel',()=>contact=false);addEventListener('blur',()=>contact=false);setTimeout(()=>intro.classList.add('hide'),2400);
function field(x,y,time,offset){const cx=W*.5+Math.cos(time*.12)*W*.055,cy=H*.48+Math.sin(time*.10)*H*.07;const dx=x-cx,dy=y-cy;const theta=Math.atan2(dy,dx);const radius=Math.hypot(dx,dy)+1;const swirl=Math.sin(radius*.009-time*.30+offset)*.46;const ax=(-dy/radius)*(1.0+swirl)*.38;const ay=(dx/radius)*(1.0+swirl)*.38;const driftX=Math.sin(y*.008+time*.37+offset)*.22+Math.sin(x*.004-time*.19)*.18;const driftY=Math.cos(x*.008-time*.29+offset)*.20+Math.sin(y*.006+time*.22)*.19;const breathe=Math.sin(time*.46+offset)*.06;let vx=ax+driftX+Math.cos(theta)*breathe,vy=ay+driftY+Math.sin(theta)*breathe;
if(fieldStrength>.002){const mx=x-px,my=y-py,dist2=mx*mx+my*my+2600,zone=Math.exp(-dist2/(Math.min(W,H)*.62)**2)*fieldStrength;const curl=contact?1.15:.50;vx+=(forceX*.18-my*.014*curl)*zone;vy+=(forceY*.18+mx*.014*curl)*zone;}return[vx,vy]}
function strokePath(points,width,alpha){if(points.length<2)return;g.beginPath();g.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length-1;i++){const a=points[i],b=points[i+1];g.quadraticCurveTo(a.x,a.y,(a.x+b.x)*.5,(a.y+b.y)*.5)}const end=points[points.length-1];g.lineTo(end.x,end.y);g.lineWidth=width;g.strokeStyle=`rgba(224,236,255,${alpha})`;g.stroke()}
function frame(timestamp){if(!last)last=timestamp;const dt=Math.min(.045,(timestamp-last)/1000);last=timestamp;if(!paused){let k=dt*60;clock+=dt*(reduced?.35:1);elapsed+=dt;idle+=dt;interaction*=Math.pow(.965,k);forceX*=Math.pow(.78,k);forceY*=Math.pow(.78,k);if(!contact)fieldStrength*=Math.pow(.976,k);if(idle>4)rel.classList.add('faint');
// Atmospheric transparency: previous motion softly lingers, never hard-cuts.
g.globalCompositeOperation='source-over';g.fillStyle='rgba(4,7,12,.115)';g.fillRect(0,0,W,H);const cx=W*.5+Math.sin(clock*.15)*W*.04,cy=H*.49+Math.cos(clock*.13)*H*.04;const R=Math.min(W,H)*(.35+interaction*.08);
const halo=g.createRadialGradient(cx,cy,0,cx,cy,R*1.7);halo.addColorStop(0,`rgba(226,237,255,${.028+interaction*.025})`);halo.addColorStop(.27,'rgba(149,181,220,.016)');halo.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=halo;g.fillRect(0,0,W,H);g.globalCompositeOperation='lighter';
for(let i=0;i<trails.length;i++){const s=trails[i],oldX=s.x,oldY=s.y;const flow=field(s.x,s.y,clock,s.phase);s.vx=(s.vx*.94+flow[0]*.42*k);s.vy=(s.vy*.94+flow[1]*.42*k);s.x+=s.vx*k;s.y+=s.vy*k;s.age+=dt;if(s.x<-W*.12||s.x>W*1.12||s.y<-H*.12||s.y>H*1.12){const a=rand(0,TAU),r=rand(0,Math.min(W,H)*.17);s.x=cx+Math.cos(a)*r;s.y=cy+Math.sin(a)*r;s.vx=s.vy=0;s.history=[]}s.history.push({x:s.x,y:s.y});if(s.history.length>33)s.history.shift();let brightness=.35+.65*Math.sin(clock*.28+s.phase)**2;
// layered translucent threads, fine bright core (no broad opaque rays)
if(s.history.length>3){strokePath(s.history,s.width*8,.012*brightness);strokePath(s.history,s.width*3,.026*brightness);strokePath(s.history,s.width,.12*brightness);if(i%5===0)strokePath(s.history,s.width*.55,.13*brightness)}
if(i%3===0){const rr=1.3+Math.sin(clock*.7+s.phase)*.7;const glow=g.createRadialGradient(s.x,s.y,0,s.x,s.y,rr*10);glow.addColorStop(0,`rgba(247,250,255,${.10*brightness})`);glow.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=glow;g.beginPath();g.arc(s.x,s.y,rr*10,0,TAU);g.fill()}}
for(const p of specks){const v=field(p.x,p.y,clock,p.phase);p.vx=p.vx*.94+v[0]*.04*k;p.vy=p.vy*.94+v[1]*.04*k;p.x+=p.vx*k;p.y+=p.vy*k;if(p.x<0)p.x+=W;if(p.x>W)p.x-=W;if(p.y<0)p.y+=H;if(p.y>H)p.y-=H;let alpha=(.06+.12*Math.sin(clock*.4+p.phase)**2)*p.z;g.fillStyle=`rgba(232,242,255,${alpha})`;g.beginPath();g.arc(p.x,p.y,.4+p.z*.8,0,TAU);g.fill()}
g.globalCompositeOperation='source-over';}
requestAnimationFrame(frame)}requestAnimationFrame(frame);
const timeText=n=>{const s=Math.floor(n);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function release(){paused=true;artNum++;const S=1080;ag.fillStyle='#05070b';ag.fillRect(0,0,S,S);const side=Math.min(c.width,c.height),sx=(c.width-side)/2,sy=(c.height-side)/2;ag.drawImage(c,sx,sy,side,side,0,0,S,S);const fade=ag.createLinearGradient(0,750,0,S);fade.addColorStop(0,'rgba(4,6,12,0)');fade.addColorStop(1,'rgba(4,6,12,.92)');ag.fillStyle=fade;ag.fillRect(0,750,S,330);ag.strokeStyle='rgba(255,255,255,.65)';ag.lineWidth=2;ag.strokeRect(30,30,S-60,S-60);ag.fillStyle='#fff';ag.textAlign='left';ag.font='bold 40px Arial,sans-serif';ag.fillText('ZEN VISIONZ',72,934);ag.font='20px Arial,sans-serif';ag.fillText('THE END IS YOURS.',74,974);ag.textAlign='right';ag.fillText('✦ '+String(artNum).padStart(3,'0'),1000,940);ag.fillText(timeText(elapsed),1000,976);document.getElementById('runtime').textContent=timeText(elapsed);document.getElementById('number').textContent='ARTWORK '+String(artNum).padStart(3,'0');modal.classList.add('open')}
document.getElementById('release').addEventListener('click',release);document.getElementById('resume').addEventListener('click',()=>{modal.classList.remove('open');paused=false;last=performance.now();idle=0;rel.classList.remove('faint')});document.getElementById('save').addEventListener('click',()=>art.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='ZEN_VISIONZ_v011_ART_'+String(artNum).padStart(3,'0')+'.png';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)},'image/png'));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))document.getElementById('resume').click()});document.addEventListener('visibilitychange',()=>{last=performance.now()});
})();
</script></body></html>
