<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#060913"><title>ZEN VISIONZ — Ver.017</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060913;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none;overscroll-behavior:none}#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 65% at center,transparent 54%,rgba(0,0,5,.32) 100%)}#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;z-index:2;transition:opacity 1.6s ease}#intro.hide{opacity:0}#intro h1{font-size:clamp(25px,7vw,44px);letter-spacing:.20em;font-weight:650;text-shadow:0 0 28px #fff8;margin:0 0 14px}#intro p{font-size:9px;letter-spacing:.23em;color:#e6edfa;line-height:2;margin:0}#intro .type{padding:26px;background:radial-gradient(ellipse,rgba(5,8,17,.66),transparent 85%)}#release{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);left:50%;transform:translateX(-50%);z-index:4;width:57px;height:57px;background:rgba(8,11,22,.08);border:0;color:#fff;font-size:30px;text-shadow:0 0 9px white,0 0 28px #d6e5ff;cursor:pointer;border-radius:50%;transition:opacity .6s ease,scale .2s ease}#release.quiet{opacity:.38}#release:active{scale:.92}#modal{position:fixed;inset:0;z-index:10;background:rgba(5,7,14,.94);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:18px;overflow:auto;touch-action:pan-y}#modal.open{display:flex}.panel{width:min(100%,460px);text-align:center;max-height:100%;overflow:auto}.eyebrow{color:#dfe7f3;letter-spacing:.30em;font-size:9px;margin:4px 0 8px}.heading{font-size:clamp(24px,7vw,36px);font-weight:650;letter-spacing:.20em;margin:0 0 6px}.sub{color:#aab8c9;font-size:10px;letter-spacing:.20em;margin:0 0 18px}#art{width:min(100%,45vh,430px);aspect-ratio:1;background:#070b13;border:1px solid #ffffff37;display:block;margin:0 auto;box-shadow:0 0 35px #dce9ff22}.details{font-size:10px;letter-spacing:.16em;color:#b9c5d4;margin:15px 0}.actions{display:flex;gap:10px;margin:12px 0}.actions button{border-radius:50px;padding:15px 12px;font-size:11px;font-weight:700;letter-spacing:.10em;flex:1;cursor:pointer;min-height:48px}.primary{background:#eef4fa;color:#10151d;border:1px solid #f2f6fa}.secondary{background:#ffffff12;color:#fff;border:1px solid #ffffff4a}@media(prefers-reduced-motion:reduce){#intro{transition:none}}
</style></head><body><canvas id="world" aria-label="無数の白い光が循環するインタラクティブアート"></canvas><div id="veil"></div><div id="intro"><div class="type"><h1>ZEN VISIONZ</h1><p>TOUCH THE ENERGY<br>✦ — RELEASE YOUR VISION</p></div></div><button id="release" aria-label="RELEASE: 今の光を作品にする">✦</button><div id="modal" role="dialog" aria-modal="true" aria-labelledby="arttitle"><div class="panel"><div class="eyebrow">THE END IS YOURS.</div><h2 class="heading" id="arttitle">RELEASED</h2><p class="sub">A MOMENT OF LIGHT</p><canvas id="art" width="1080" height="1080"></canvas><p class="details" id="moment">ZEN VISIONZ · 00:00</p><div class="actions"><button class="primary" id="save">SAVE ART</button><button class="secondary" id="continue">KEEP FLOWING</button></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('world'),g=canvas.getContext('2d',{alpha:false});
const intro=document.getElementById('intro'),release=document.getElementById('release'),modal=document.getElementById('modal'),art=document.getElementById('art'),ag=art.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mix=(a,b,q)=>a+(b-a)*q;
const smooth=(a,b,q)=>a+(b-a)*Math.min(1,q);
const TAU=2*Math.PI;
let W=0,H=0,dpr=1,t=0,elapsed=0,last=0,paused=false;
let pointer={x:.5,y:.5,px:.5,py:.5,down:false,force:0,swirl:0,dx:0,dy:0,hold:0};
let quietTimer=0,artNumber=0;
let seed=214;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
const strands=Array.from({length:166},(_,i)=>({
 u:rand(),depth:rand(),offset:rand()*2-1,freq:1+rand()*2.7,phase:rand()*TAU,
 speed:.18+rand()*.37,shape:rand(),white:rand(),side:i%2?1:-1,
 lane:rand(),width:.32+rand()*.8
}));
const dust=Array.from({length:145},()=>({s:rand(),u:rand(),phase:rand()*TAU,scale:rand(),side:rand()>.5?1:-1}));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,Math.max(W,H)>1300?1.35:1.7);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0);}addEventListener('resize',resize,{passive:true});resize();
function move(e){const nx=clamp(e.clientX/W,0,1),ny=clamp(e.clientY/H,0,1);pointer.dx=clamp((nx-pointer.px)*8,-1,1);pointer.dy=clamp((ny-pointer.py)*8,-1,1);pointer.px=nx;pointer.py=ny;pointer.x=nx;pointer.y=ny;pointer.force=Math.min(1.4,pointer.force+.26+Math.hypot(pointer.dx,pointer.dy)*.45);pointer.swirl=clamp(pointer.swirl+pointer.dx*.45,-1.2,1.2);quietTimer=0;release.classList.remove('quiet');intro.classList.add('hide');}
canvas.addEventListener('pointerdown',e=>{pointer.down=true;pointer.hold=0;pointer.px=e.clientX/W;pointer.py=e.clientY/H;move(e);try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(pointer.down)move(e)});
function lift(){pointer.down=false;pointer.hold=0;}
canvas.addEventListener('pointerup',lift);canvas.addEventListener('pointercancel',lift);addEventListener('blur',lift);
setTimeout(()=>intro.classList.add('hide'),2400);
function rgba(r,gg,b,a){return `rgba(${r},${gg},${b},${a})`;}
// Coordinates describe a living filament field. Every strand is generated from a continuously
// changing center-to-edge energy current, not from rotating fixed circles.
function pos(s,z,time,core,span,interaction){
 const {cx,cy,scale}=core;
 const v=(z-.5)*2;
 const depth=s.depth;
 // long flowing cathedral-like arcs, mirrored but never rigid
 const neck=Math.pow(Math.abs(v),1.3);
 const envelope=(.11+.55*neck)*(0.20+depth*.80);
 const spread=(.09+s.u*.64)*envelope;
 const breathe=1+.10*Math.sin(time*.19+s.phase*.3);
 let x=(s.side*spread + .026*Math.sin(v*2.6+time*.18+s.phase)*(.3+depth)) *span*breathe;
 let y=v*scale*(.73+.24*s.shape);
 // Curved trajectories bend toward the center, then reopen near the top and bottom.
 const arc=.10*Math.sin((v+1)*Math.PI*.8+s.phase*.33+time*.13)*(s.u-.5);
 x+=s.side*arc*span;
 x+=span*.018*Math.sin(time*s.speed + v*s.freq*3+s.phase);
 y+=scale*.032*Math.sin(time*.24+v*3+s.phase);
 // Touch makes a large, spatially coherent ripple rather than individual jitter.
 const px=(interaction.x-.5)*span*1.65;
 const py=(interaction.y-.5)*scale*1.75;
 const ddx=x-px, ddy=y-py;
 const influence=Math.exp(-(ddx*ddx/(span*span*.42)+ddy*ddy/(scale*scale*.33)));
 const touch=interaction.force*influence;
 x+=interaction.dx*touch*span*.23;
 y+=interaction.dy*touch*scale*.16;
 const a=interaction.swirl*touch*.32;
 const rx=x-px,ry=y-py;
 x+=-ry*a*.68;
 y+=rx*a*.42;
 // Hold brings fine light toward the finger and gathers a powerful white core.
 x+=(px-x)*touch*interaction.hold*.17;
 y+=(py-y)*touch*interaction.hold*.18;
 return [cx+x,cy+y];
}
function draw(time,ctx,width,height,detail=1){
 const cx=width*.5+Math.sin(time*.08)*width*.009;
 const cy=height*.49;
 const scale=Math.max(height*.74,width*.67),span=Math.min(width*1.10,scale*.90);
 const core={cx,cy,scale};
 // very dark navy creates the perception of luminous white rather than neon colours
 const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(width,height)*.83);
 bg.addColorStop(0,'#101727');bg.addColorStop(.38,'#090f1c');bg.addColorStop(1,'#03050a');
 ctx.fillStyle=bg;ctx.fillRect(0,0,width,height);
 ctx.globalCompositeOperation='screen';
 let aura=ctx.createRadialGradient(cx,cy,0,cx,cy,scale*.58);
 aura.addColorStop(0,'rgba(251,252,255,.14)');aura.addColorStop(.18,'rgba(215,231,255,.10)');aura.addColorStop(.46,'rgba(156,189,235,.038)');aura.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=aura;ctx.fillRect(0,0,width,height);
 const interaction={...pointer};
 // Consistent geometry and four intertwined currents, each animated continuously.
 const n=detail?strands.length:110,steps=detail?42:30;
 for(let i=0;i<n;i++){
   const s=strands[i];
   const b= -0.10 + ((s.lane*1.2+time*s.speed*.028)%1.2);
   const path=new Path2D();
   for(let j=0;j<=steps;j++){
     const v=j/steps;
     const z=v;
     const [x,y]=pos(s,z,time+b,core,span,interaction);
     if(j===0)path.moveTo(x,y);else path.lineTo(x,y);
   }
   const centerAlpha=.12+s.white*.20+interaction.hold*.075;
   if(i%5===0){
     ctx.strokeStyle=rgba(196,219,255,.045+interaction.hold*.018);
     ctx.lineWidth=3.7+s.width*3.1;
     ctx.stroke(path);
   }
   ctx.strokeStyle=rgba(240,247,255,centerAlpha);
   ctx.lineWidth=.42+s.width*.55;
   ctx.stroke(path);
 }
 // travelling photons communicate unmistakable movement even while the field remains serene
 for(let i=0;i<dust.length;i++){
   const p=dust[i],s=strands[(i*17)%strands.length];
   const z=(p.u+time*(.017+p.scale*.017))%1;
   const [x,y]=pos(s,z,time,core,span,interaction);
   if(x<0||x>width||y<0||y>height)continue;
   const rad=.30+p.scale*.85+interaction.hold*.35;
   const alpha=.21+p.scale*.30;
   ctx.beginPath();ctx.fillStyle=rgba(255,255,255,alpha);ctx.arc(x,y,rad,0,TAU);ctx.fill();
 }
 // The axial stream brightens and contracts gently; no broad rays or rigid rings.
 const bright=.72+Math.sin(time*.43)*.16+pointer.hold*.30;
 const axis=ctx.createLinearGradient(cx,cy-scale*.71,cx,cy+scale*.71);
 axis.addColorStop(0,'rgba(255,255,255,0)');axis.addColorStop(.23,rgba(232,243,255,.030*bright));axis.addColorStop(.5,rgba(255,255,255,.115*bright));axis.addColorStop(.77,rgba(238,245,255,.032*bright));axis.addColorStop(1,'rgba(255,255,255,0)');
 ctx.fillStyle=axis;ctx.fillRect(cx-span*.11,cy-scale*.72,span*.22,scale*1.44);
 // touch focal energy - soft volume, never a literal interface marker
 if(pointer.force>.02){
  const xx=pointer.x*width,yy=pointer.y*height,r=width*(.18+pointer.hold*.15);
  const a=ctx.createRadialGradient(xx,yy,0,xx,yy,r);
  a.addColorStop(0,rgba(255,255,255,.11*pointer.force+.18*pointer.hold));
  a.addColorStop(.20,rgba(240,249,255,.045*pointer.force+.06*pointer.hold));
  a.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=a;ctx.beginPath();ctx.arc(xx,yy,r,0,TAU);ctx.fill();
 }
 ctx.globalCompositeOperation='source-over';
}
function frame(now){if(!last)last=now;const dt=Math.min(.045,(now-last)/1000);last=now;if(!paused){t+=dt*(reduce?.5:1);elapsed+=dt;quietTimer+=dt;if(quietTimer>4)release.classList.add('quiet');pointer.force=smooth(pointer.force, pointer.down?.52:0,dt*(pointer.down?1.3:1.6));pointer.hold=smooth(pointer.hold,pointer.down?1:0,dt*(pointer.down?1.0:1.8));pointer.dx*=Math.pow(.13,dt);pointer.dy*=Math.pow(.13,dt);pointer.swirl*=Math.pow(.22,dt);draw(t,g,W,H,W>500?1:0);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
function clock(sec){let n=Math.floor(sec);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
release.addEventListener('click',()=>{
 paused=true;artNumber++;
 const s=1080,ratio=W/H;
 const off=document.createElement('canvas');off.width=1080;off.height=1080;const c=off.getContext('2d');
 // use the exact on-screen image; center crop to a square, preserving this moment
 const side=Math.min(canvas.width,canvas.height);const sx=(canvas.width-side)/2,sy=(canvas.height-side)/2;
 c.drawImage(canvas,sx,sy,side,side,0,0,s,s);
 const fade=c.createLinearGradient(0,770,0,s);fade.addColorStop(0,'#05091300');fade.addColorStop(1,'#050913db');c.fillStyle=fade;c.fillRect(0,770,s,310);
 c.fillStyle='#fff';c.textAlign='left';c.font='600 35px Arial,sans-serif';c.fillText('ZEN VISIONZ',64,960);
 c.font='18px Arial,sans-serif';c.fillStyle='#dae7f8';c.fillText('THE END IS YOURS.',65,994);
 c.textAlign='right';c.fillStyle='#fff';c.fillText('✦ '+clock(elapsed),1010,984);
 ag.clearRect(0,0,s,s);ag.drawImage(off,0,0);document.getElementById('moment').textContent=`ZEN VISIONZ · ${clock(elapsed)} · #${String(artNumber).padStart(3,'0')}`;
 modal.classList.add('open');
});
document.getElementById('continue').addEventListener('click',()=>{modal.classList.remove('open');paused=false;last=performance.now();quietTimer=0;release.classList.remove('quiet');});
document.getElementById('save').addEventListener('click',()=>{art.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`ZEN_VISIONZ_RELEASE_${String(artNumber).padStart(3,'0')}.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/png')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))document.getElementById('continue').click()});
document.addEventListener('visibilitychange',()=>{last=performance.now()});
})();
</script></body></html>
